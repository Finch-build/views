[package]
name = "views-settings"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
views-core = { path = "../../crates/core" }

[target.'cfg(windows)'.dependencies]
views-windows = { path = "../../crates/windows" }

[target.'cfg(target_os = "macos")'.dependencies]
views-macos = { path = "../../crates/macos" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
