[workspace]
resolver = "3"
members = ["crates/*"]
# The Settings UI is its own workspace, so nothing it depends on can reach the Engine.
exclude = ["ui/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
views-core = { path = "crates/core" }
views-platform = { path = "crates/platform" }
views-windows = { path = "crates/windows" }
views-macos = { path = "crates/macos" }

# The Engine has a 1 MB binary budget, so release builds optimise for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
